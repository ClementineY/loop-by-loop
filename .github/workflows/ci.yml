name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Test learning engine
        run: npm test
      - name: Verify Colab experiments
        run: npm run notebooks:verify
      - name: Type check
        run: npm run typecheck
      - name: Build production output
        run: npm run build

